# nanobox sandbox configuration
# Edit this file to customize your sandbox environment.
# Run 'nbox status' to preview the resulting bwrap command.
#
# Path syntax:
#   /absolute/path  — mounted directly
#   ~/relative      — expanded to $HOME/relative
#   "~"             — expanded to $HOME (quote to avoid YAML null)
#
# Glob patterns (entries not starting with / or ~):
#   In 'read':  matched against project directory entries, forced read-only
#   In 'deny':  matched against project directory file basenames, masked with /dev/null
#   Prefix with ! to negate a deny pattern

mounts:
  # Read-only mounts: system directories and tools
  read:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
    - ~/.local/bin
    - ~/.local/gcc-11
    - ~/.local/share/uv
    - ~/.config/uv
    - ~/.config/nvim
    - ~/.config/jj
    - ~/.config/glab-cli
    - ~/ripgrep-14.1.0-x86_64-unknown-linux-musl
    - ~/fd-v10.1.0-x86_64-unknown-linux-musl
    - ~/nvim-linux64
    - ~/jj
    - ~/dotfiles
    # Glob: force .venv directories read-only within the project
    - ".venv*"

  # Read-write mounts (project directory is always rw implicitly)
  write:
    - ~/.local/share/claude
    - ~/.claude
    - ~/.pi
    - ~/pi
    - ~/.tau
    - ~/tau
    - ~/.claude.json
    - ~/.cache

  # Deny patterns: mask matching files in the project directory with /dev/null
  deny:
    - ".env*"
    - "!*.example"

# PATH inside the sandbox (in order)
path:
  - ~/.local/bin
  - ~/ripgrep-14.1.0-x86_64-unknown-linux-musl
  - ~/fd-v10.1.0-x86_64-unknown-linux-musl
  - ~/nvim-linux64/bin
  - ~/.local/gcc-11/bin
  - "~"
  - /usr/local/sbin
  - /usr/local/bin
  - /usr/sbin
  - /usr/bin
  - /sbin
  - /bin

# Environment variables
env:
  # Forward from host (supports glob patterns like CUDA_*)
  # Do NOT forward API keys or tokens here: they would reach the sandbox and
  # appear in the bwrap command line. Inject them via the credential proxy
  # instead (nbox proxy / nbox resolve, HTTPS only).
  forward:
    - TERM
    - COLORTERM
    - EDITOR
    - LANG
    - LC_ALL
    - HF_HOME
    - HF_HUB_CACHE
    - CLAUDE_CODE_NO_FLICKER
    - SSH_AUTH_SOCK
    - GITLAB_REMOTE_PROJECT
    - "CUDA_*"
    - "NCCL_*"
    - "TORCH_*"
    - "NVIDIA_*"
    - "CUDNN_*"

  # Set explicitly inside the sandbox
  set:
    SHELL: /bin/bash
    TORCHINDUCTOR_CACHE_DIR: ~/.cache/torch/inductor
    TRITON_CACHE_DIR: ~/.cache/triton

# Proxy egress policy (default-deny when this section is present).
# Hosts not listed here get HTTP 403 from the credential proxy. Exact names
# and glob patterns are supported. Telemetry endpoints (sentry/statsig under
# *.anthropic.com) and unrelated hosts are deliberately absent: enable them
# explicitly only if a tool actually needs them.
proxy:
  allow:
    - api.anthropic.com
    - api.search.brave.com
    - api.openai.com
    - auth.openai.com
    - chatgpt.com
    - "*.chatgpt.com"
    - opencode.ai
    - "*.opencode.ai"
    - api.studio.nebius.ai
    - claude.ai
    - "*.claude.ai"
    - gitlab.com
    - "*.gitlab.com"
    - github.com
    - "*.github.com"
    - "*.githubusercontent.com"
    - huggingface.co
    - "*.huggingface.co"
    - pypi.org
    - files.pythonhosted.org
